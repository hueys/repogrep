name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -count=1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # action v6 doesn't support golangci-lint v2 at all (hard error);
          # v7+ is required (v9 pinned here for the node24 runtime; v8 was
          # the first with golangci-lint v2 support). Pinned to a v2.x
          # golangci-lint release rather than "latest" since that has
          # previously resolved to a stale v1.x build incompatible with
          # our go.mod. Keep in sync with the locally installed version
          # (`golangci-lint --version`).
          version: v2.12.2

      - name: Install zizmor
        run: pip install --user zizmor==1.29.0

      - name: zizmor (GitHub Actions workflow security)
        run: ~/.local/bin/zizmor .github/workflows/
