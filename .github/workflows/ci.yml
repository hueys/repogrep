name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -count=1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          # action v6 doesn't support golangci-lint v2 at all (hard error);
          # v7 is required. Pinned to a v2.x golangci-lint release rather
          # than "latest" since that has previously resolved to a stale
          # v1.x build incompatible with our go.mod. Keep in sync with the
          # locally installed version (`golangci-lint --version`).
          version: v2.12.2

      - name: Install zizmor
        run: pip install --user zizmor==1.29.0

      - name: zizmor (GitHub Actions workflow security)
        run: ~/.local/bin/zizmor .github/workflows/
